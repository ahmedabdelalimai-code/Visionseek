openapi: 3.1.0
info:
  title: VisionSeek OS API
  version: 0.1.0
  description: |
    Sprint 1 API contracts for VisionSeek OS, an Integrated Strategic Opportunity
    Intelligence and Venture Creation Operating System. Final decisions require
    authenticated human authority; AI assistance is never an approval authority.
servers:
  - url: http://localhost:3000
    description: Local development
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Return application health information
      responses:
        '200':
          description: Application is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/opportunities:
    post:
      operationId: createOpportunity
      summary: Create a classified opportunity
      description: Every opportunity must be classified as Tactical, Strategic, or Mixed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOpportunityRequest'
      responses:
        '201':
          description: Opportunity created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/opportunities/{opportunityId}/readiness:
    get:
      operationId: getOpportunityDecisionReadiness
      summary: Evaluate mandatory DecisionReady gates
      description: |
        Returns readiness only when the active thesis, evidence, owner, review
        date, and key gaps are present. This endpoint does not make a decision.
      parameters:
        - $ref: '#/components/parameters/OpportunityId'
      responses:
        '200':
          description: Readiness evaluation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/evidence:
    post:
      operationId: captureEvidence
      summary: Capture evidence linked to an opportunity or claim
      description: The production storage upload adapter is intentionally deferred.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvidenceRequest'
      responses:
        '201':
          description: Evidence captured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/decisions:
    post:
      operationId: recordDecision
      summary: Record a final human decision
      description: |
        AI cannot approve final decisions. The server must verify a human
        principal and mandatory DecisionReady conditions before persistence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDecisionRequest'
      responses:
        '201':
          description: Decision recorded and audit event appended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Opportunity is not DecisionReady
components:
  parameters:
    OpportunityId:
      name: opportunityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ValidationError:
      description: Request fails runtime validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: visionseek-os
        version:
          type: string
    OpportunityClassification:
      type: string
      enum: [TACTICAL, STRATEGIC, MIXED]
    OpportunityStatus:
      type: string
      enum: [DRAFT, QUALIFYING, DECISION_READY, DECIDED, ARCHIVED]
    LifecycleStage:
      type: string
      enum: [DETECT, VERIFY, UNDERSTAND, CONNECT, DECIDE, BUILD, OPERATE, LEARN, COMPOUND]
    CreateOpportunityRequest:
      type: object
      required: [title, summary, classification]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        summary:
          type: string
          minLength: 1
          maxLength: 5000
        classification:
          $ref: '#/components/schemas/OpportunityClassification'
        status:
          $ref: '#/components/schemas/OpportunityStatus'
        ownerActorId:
          type: [string, 'null']
          format: uuid
        reviewDate:
          type: [string, 'null']
          format: date-time
        keyGaps:
          type: array
          items:
            type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        lifecycleStage:
          $ref: '#/components/schemas/LifecycleStage'
    OpportunityResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Opportunity'
    Opportunity:
      allOf:
        - $ref: '#/components/schemas/CreateOpportunityRequest'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    ReadinessResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [opportunityId, isReady, missing]
          properties:
            opportunityId:
              type: string
              format: uuid
            isReady:
              type: boolean
            missing:
              type: array
              items:
                type: string
                enum: [ACTIVE_THESIS, EVIDENCE, OWNER, REVIEW_DATE, KEY_GAPS]
    CreateEvidenceRequest:
      type: object
      required: [opportunityId, title, excerpt, capturedByActorId]
      properties:
        opportunityId:
          type: string
          format: uuid
        claimId:
          type: [string, 'null']
          format: uuid
        sourceId:
          type: [string, 'null']
          format: uuid
        title:
          type: string
          minLength: 1
        excerpt:
          type: string
          minLength: 1
        capturedByActorId:
          type: string
          format: uuid
        reliabilityScore:
          type: number
          minimum: 0
          maximum: 1
        corroborationStatus:
          type: string
          enum: [UNVERIFIED, PARTIAL, CORROBORATED, REFUTED]
    EvidenceResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true
    CreateDecisionRequest:
      type: object
      required: [opportunityId, outcome, rationale, decidedByActorId, actorKind]
      properties:
        opportunityId:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [APPROVED, REJECTED, DEFERRED]
        rationale:
          type: string
          minLength: 1
        decidedByActorId:
          type: string
          format: uuid
        actorKind:
          type: string
          const: HUMAN
    DecisionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
