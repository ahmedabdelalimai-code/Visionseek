services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: visionseek
      POSTGRES_PASSWORD: visionseek_password
      POSTGRES_DB: visionseek_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
