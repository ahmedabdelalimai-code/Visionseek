services:
  db:
    image: postgres:16-alpine
    container_name: visionseek-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visionseek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visionseek_password}
      POSTGRES_DB: ${POSTGRES_DB:-visionseek_os}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - visionseek_postgres_data:/var/lib/postgresql/data

volumes:
  visionseek_postgres_data:
